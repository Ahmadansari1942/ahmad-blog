name: CI/CD (build -> scan -> push -> GitOps)
on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "docs/**"
      - "scripts/**"
      - "**.md"
  pull_request:
    branches: [main]

env:
  IMAGE: ahmadansari19/ahmad-blog

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-release:
    # Only on main. Pull requests just run the tests above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the new image tag back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short git SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1) build locally (not pushed yet) so it can be scanned first
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # 3) push immutable SHA tag (+ "latest" only as a convenience for first bootstrap)
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      # 4) GitOps: bump the tag in git. ArgoCD sees the commit and deploys it.
      - name: Update image tag in k8s overlay
        run: |
          sed -i "s|newTag: .*|newTag: ${TAG}|" k8s/overlays/prod/kustomization.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "deploy: ahmad-blog ${TAG} [skip ci]"
          git push

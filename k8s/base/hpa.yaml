apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ahmad-blog
  labels:
    app.kubernetes.io/name: ahmad-blog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ahmad-blog
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

# Alert rules for the 3 tiers. Alertmanager is off, so they show up in
# Prometheus -> Alerts and Grafana -> Alerting -> Alert rules (not sent by email yet).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ahmad-blog
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ahmad-blog
spec:
  groups:
    - name: ahmad-blog.app
      rules:
        - alert: AhmadBlogDown
          expr: absent(up{job="ahmad-blog"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "No AhmadBlog pod is being scraped successfully"
            description: "Prometheus has seen no healthy ahmad-blog target for 2 minutes."
        - alert: AhmadBlogHigh5xxRate
          expr: |
            (sum(rate(http_request_duration_seconds_count{job="ahmad-blog",status=~"5.."}[5m])) or vector(0))
            / clamp_min(sum(rate(http_request_duration_seconds_count{job="ahmad-blog"}[5m])), 0.001) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of requests fail with 5xx"
        - alert: AhmadBlogSlowResponses
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="ahmad-blog"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "95th percentile response time is above 1 second"
    - name: ahmad-blog.database
      rules:
        - alert: MySQLPodNotReady
          expr: kube_pod_status_ready{namespace="ahmad-blog",pod="mysql-0",condition="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "mysql-0 is not Ready"
        - alert: MySQLVolumeAlmostFull
          expr: |
            kubelet_volume_stats_used_bytes{namespace="ahmad-blog",persistentvolumeclaim="data-mysql-0"}
            / kubelet_volume_stats_capacity_bytes{namespace="ahmad-blog",persistentvolumeclaim="data-mysql-0"} > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "MySQL data volume is more than 85% full"
        - alert: MySQLBackupFailed
          expr: kube_job_status_failed{namespace="ahmad-blog",job_name=~"mysql-backup.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The nightly MySQL backup job failed"

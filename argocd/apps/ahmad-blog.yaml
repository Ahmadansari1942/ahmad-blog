apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ahmad-blog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ahmad-blog
  source:
    repoURL: https://github.com/Ahmadansari1942/ahmad-blog.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ahmad-blog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # the HPA owns the replica count — don't fight it
    - group: apps
      kind: Deployment
      name: ahmad-blog
      jsonPointers:
        - /spec/replicas

name: Deploy Node.js to ECS

on:
  push:
    branches:
      - main   # sirf main branch pe push hone pe chalega

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub ka free Linux machine

    steps:

      # Step 1: Code download karo runner pe
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Docker Hub pe login karo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Image build karo aur push karo
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ahmadansari19/ahmad-blog:latest

      # Step 4: AWS credentials set karo
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Step 5: ECS service ko force deploy karo
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster my-cluster \
            --service node-service \
            --force-new-deployment \
            --region us-east-2
